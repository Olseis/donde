<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../../img/logo.png">
</head>

<body data-page="ubicacion">
  <!-- PANTALLA DE UBICACIÓN -->
  <div id="location-screen" class="screen">
    <h2>Tu punto de partida</h2>

    <button id="btn-saved-location" class="btn-action btn-orange" style="display: none;">🔄 Usar última
      ubicación</button>
    <button id="btn-gps" class="btn-action btn-green">📍 Usar ubicación GPS</button>

    <p>O marca tu posición en el mapa:</p>
    <div id="select-map-container"></div>

    <button id="btn-confirm-location" disabled>Confirmar Mapa</button>
    <p id="location-loading-text" class="loading-text"></p>
  </div>

  <!-- Archivos Modulares -->
  <script src="../JS/data.js"></script>
  <script src="../JS/app.js"></script>
</body>

</html>
