# ==========================================================
#  Endurecimiento del servicio "donde" (encierro del proceso de Node)
#  Se instala en /etc/systemd/system/donde.service.d/endurecido.conf
#
#  Todo esto lo aplica el núcleo al arrancar el servicio, así que no
#  gasta CPU ni memoria durante las partidas. Si el VPS no admite
#  alguna opción (pasa en algunos contenedores), deploy/endurecer.sh
#  lo detecta y lo quita para que el juego siga funcionando.
# ==========================================================
[Service]
# Sin red hacia fuera: solo habla con Apache por 127.0.0.1.
# Si alguien lograra ejecutar código dentro, no podría descargar nada ni conectarse a nada.
IPAddressDeny=any
IPAddressAllow=localhost
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# Sin permisos especiales, sin dispositivos y sin tocar el núcleo
CapabilityBoundingSet=
AmbientCapabilities=
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
RemoveIPC=true
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
