# ==========================================================
#  Apache para ¿Dónde queda...?
#  instalar-servidor.sh copia este archivo a
#  /etc/apache2/sites-available/donde.conf cambiando __IP__ y __WWW__.
# ==========================================================

# --- Puerto 80: solo sirve para que Let's Encrypt compruebe el servidor
#     y para mandar a todo el mundo a HTTPS.
<VirtualHost *:80>
    ServerName __IP__

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# --- Puerto 443: el juego, la API y las partidas online
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __IP__

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/__IP__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__IP__/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # El juego: solo la carpeta www del repositorio (server/, .git, etc. quedan fuera)
    DocumentRoot __WWW__
    <Directory __WWW__>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Partidas online (WebSocket) y API → servidor Node en el puerto 3000
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /ws  ws://127.0.0.1:3000/ws
    ProxyPassReverse /ws  ws://127.0.0.1:3000/ws
    ProxyPass        /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
    RequestHeader set X-Forwarded-Proto "https"

    # Seguridad básica
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # El juego necesita GPS y brújula en esta misma web
    Header always set Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"

    # Que el móvil no se quede con versiones viejas del juego tras cada push
    <FilesMatch "\.(html|js|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/donde-error.log
    CustomLog ${APACHE_LOG_DIR}/donde-access.log combined
</VirtualHost>
</IfModule>
